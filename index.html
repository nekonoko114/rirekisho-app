<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>履歴書</title>
  </head>
  <body>
    <div class="rirekisho-container">
      <!-- 左ページ -->
      <div class="page page-left">
        <div class="page-heading">
          <h1 class="title">履歴書</h1>
          <div class="date-label">年　月　日現在</div>
        </div>

        <div class="date-section">
          <div class="note-box">
            <p>写真を貼る位置</p>
            <p class="small-text">写真を貼る必要が<br />ない場合×</p>
            <p class="small-text">
              1. 縦<br />2. 本人単身顔から上<br />3. 撮影から3ヶ月
            </p>
          </div>
        </div>

        <!-- ふりがな・氏名 -->
        <div class="user-name-section">
          <div>
            <div class="furigana">
              ふりがな<span class="furigana-value"></span>
            </div>
          </div>
          <div class="name-label">
            <div class="name-label">氏　名</div>
            <div class="name-value"></div>
          </div>
        </div>

        <!-- 生年月日・性別 -->
        <div class="birth">
          <div class="birth-wrapper">
            <span class="birth-date">年　月　日生</span>
            <span class="age">（満　　歳）</span>
          </div>
          <span class="gender">性別</span>
        </div>

        <!-- 住所 -->
        <div class="address-section">
          <div class="address-section-wrapper">
            <div class="address-furigana">
              <div class="address-label">ふりがな</div>
              <div class="address-value"></div>
            </div>
            <div class="address-detail">
              <div class="address-label">現住所　〒</div>
              <div class="address-value"></div>
            </div>
          </div>
          <div class="phone-label">電話番号</div>
        </div>

        <!-- 連絡先 -->
        <div class="contact-address-section">
          <div class="contact-address-section-wrapper">
            <div class="contact-address-furigana">
              <span class="contact-address-label">ふりがな</span>
              <span class="contact-address-value"></span>
            </div>
            <div class="contact-address-detail">
              <span class="contact-address-label">現住所　〒</span>
              <span class="contact-address-value"></span>
            </div>
          </div>
          <div class="phone-label">電話番号</div>
        </div>
        <!-- メールアドレス -->
        <div class="email-label">メールアドレス</div>
        <div class="email-value"></div>
        <!-- 学歴・職歴 -->
        <table class="history-table">
          <tr>
            <th class="year-header">年</th>
            <th class="month-header">月</th>
            <th class="history-header">学　歴・職　歴（各別にまとめて書く）</th>
          </tr>
          <tr>
            <td></td>

            <td></td>

        </table>
      </div>

      <!-- 右ページ -->
      <div class="page page-right">
        <!-- 学歴・職歴（続き）上部 -->
        <table class="history-table-right">
          <tr>
            <th class="year-header">年</th>
            <th class="month-header">月</th>
            <th class="history-header">学　歴・職　歴（各別にまとめて書く）</th>

          <div class="section-header">
            志望の動機、特技、好きな学科、アピールポイントなど
          </div>
          <div class="content-area"></div>
        </div>

        <!-- 本人希望欄 -->
        <div class="request-section">
          <div class="section-header">
            本人希望欄（特に給料・職種・勤務時間・勤務地・その他についての希望などがあれば記入）
