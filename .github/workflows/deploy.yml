name: Deploy to XSERVER

on:
  push:
    branches:
      - main
      - master
      - feat/ci-add-workflow

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install NPM dependencies and build
        run: |
          npm ci
          npm run build

      - name: Setup SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.XSERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.XSERVER_PORT }} ${{ secrets.XSERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "--- SSH key debug ---"
          head -1 ~/.ssh/id_rsa
          tail -1 ~/.ssh/id_rsa
          wc -l ~/.ssh/id_rsa
          wc -c ~/.ssh/id_rsa
          ssh-keygen -l -f ~/.ssh/id_rsa && echo "鍵の読み取り成功" || echo "鍵の読み取りに失敗"
          echo "--- known_hosts ---"
          cat ~/.ssh/known_hosts | head -3

      - name: Test SSH connection
        run: |
          ssh -v -p ${{ secrets.XSERVER_PORT }} -o StrictHostKeyChecking=no -o PubkeyAcceptedAlgorithms=+ssh-rsa -o HostKeyAlgorithms=+ssh-rsa ${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }} "echo SSH接続テスト成功"

      - name: Deploy files via rsync
        run: |
          rsync -avz -e "ssh -p ${{ secrets.XSERVER_PORT }} -o StrictHostKeyChecking=no -o PubkeyAcceptedAlgorithms=+ssh-rsa -o HostKeyAlgorithms=+ssh-rsa" --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude '/storage/app/public/' \
            --exclude '/storage/framework/' \
            --exclude '/storage/logs/' \
            --exclude '.env' \
            ./ ${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }}:~/resume-app/

      - name: Run post-deployment artisan commands
        run: |
          ssh -p ${{ secrets.XSERVER_PORT }} -o StrictHostKeyChecking=no -o PubkeyAcceptedAlgorithms=+ssh-rsa -o HostKeyAlgorithms=+ssh-rsa ${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }} << 'EOF'
            cd ~/resume-app
            # Generate config and route cache
            php artisan cache:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            
            # Safely run migrations
            php artisan migrate --force
          EOF
