name: Deploy to XSERVER

on:
  push:
    branches:
      - main
      - master
      - feat/ci-add-workflow

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install NPM dependencies and build
        run: |
          npm ci
          npm run build

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.XSERVER_SSH_KEY }}
          known_hosts: 'unnecessary'
          config: |
            Host *
              StrictHostKeyChecking no
              PubkeyAcceptedAlgorithms +ssh-rsa
              HostKeyAlgorithms +ssh-rsa

      - name: Test SSH connection
        run: |
          ssh -v -p ${{ secrets.XSERVER_PORT }} ${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }} "echo SSH接続テスト成功"

      - name: Deploy files via rsync
        run: |
          rsync -avz -e "ssh -p ${{ secrets.XSERVER_PORT }}" --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude '/storage/app/public/' \
            --exclude '/storage/framework/' \
            --exclude '/storage/logs/' \
            --exclude '.env' \
            ./ ${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }}:~/resume-app/

      - name: Run post-deployment artisan commands
        run: |
          ssh -p ${{ secrets.XSERVER_PORT }} -o StrictHostKeyChecking=no -o PubkeyAcceptedAlgorithms=+ssh-rsa -o HostKeyAlgorithms=+ssh-rsa ${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }} << 'EOF'
            cd ~/resume-app
            # Generate config and route cache
            php8.2 artisan cache:clear
            php8.2 artisan config:cache
            php8.2 artisan route:cache
            php8.2 artisan view:cache
            
            # Safely run migrations
            php8.2 artisan migrate --force
          EOF
