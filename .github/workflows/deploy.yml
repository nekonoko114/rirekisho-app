name: Deploy to XSERVER

on:
  push:
    branches:
      - main
      - master
      - feat/ci-add-workflow
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install NPM dependencies and build
        run: |
          npm ci
          npm run build

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.XSERVER_SSH_KEY }}
          known_hosts: 'unnecessary'
          config: |
            Host *
              StrictHostKeyChecking no
              PubkeyAcceptedAlgorithms +ssh-rsa
              HostKeyAlgorithms +ssh-rsa

      - name: Test SSH connection
        run: |
          ssh -v -p ${{ secrets.XSERVER_PORT }} ${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }} "echo SSH接続テスト成功"

      - name: Deploy files via rsync
        run: |
          rsync -avz -e "ssh -p ${{ secrets.XSERVER_PORT }}" --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude '/storage/app/public/' \
            --exclude '/storage/framework/' \
            --exclude '/storage/logs/' \
            --exclude '.env' \
            ./ ${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }}:~/resume-app/

      - name: Backup database before migration
        run: |
          ssh -p ${{ secrets.XSERVER_PORT }} -o StrictHostKeyChecking=no -o PubkeyAcceptedAlgorithms=+ssh-rsa -o HostKeyAlgorithms=+ssh-rsa ${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }} << 'EOF'
            set -e
            set -o pipefail 2>/dev/null || true
            cd ~/resume-app

            # .env からDB接続情報を読み取る（値の引用符とCRを除去）
            get_env() { grep "^$1=" .env | head -1 | cut -d= -f2- | tr -d '"' | tr -d "\r"; }
            DB_HOST=$(get_env DB_HOST)
            DB_NAME=$(get_env DB_DATABASE)
            DB_USER=$(get_env DB_USERNAME)
            DB_PASS=$(get_env DB_PASSWORD)

            mkdir -p ~/db_backups
            BACKUP_FILE=~/db_backups/backup_$(date +%Y%m%d_%H%M%S).sql.gz
            mysqldump --single-transaction -h "$DB_HOST" -u "$DB_USER" -p"$DB_PASS" "$DB_NAME" | gzip > "$BACKUP_FILE"

            # 空バックアップならデプロイを中断
            if [ ! -s "$BACKUP_FILE" ]; then
              echo "バックアップが空です。デプロイを中断します。"
              exit 1
            fi
            echo "バックアップ作成: $BACKUP_FILE ($(du -h "$BACKUP_FILE" | cut -f1))"

            # 直近14世代のみ保持
            ls -t ~/db_backups/backup_*.sql.gz | tail -n +15 | xargs rm -f 2>/dev/null || true
          EOF

      - name: Run post-deployment artisan commands
        run: |
          ssh -p ${{ secrets.XSERVER_PORT }} -o StrictHostKeyChecking=no -o PubkeyAcceptedAlgorithms=+ssh-rsa -o HostKeyAlgorithms=+ssh-rsa ${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }} << 'EOF'
            cd ~/resume-app
            # Generate config and route cache
            php8.2 artisan cache:clear
            php8.2 artisan config:cache
            php8.2 artisan route:cache
            php8.2 artisan view:cache
            
            # Create storage symlink
            
            php8.2 artisan storage:link || true
            
            # Safely run migrations
            php8.2 artisan migrate --force
          EOF
